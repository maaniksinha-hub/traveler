[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traveler"
version = "0.1.0"
description = "A decision engine for booking flights cheaply, from and to India."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
traveler = "traveler.cli:main"

[tool.setuptools]
packages = ["traveler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
