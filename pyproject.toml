[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traveler"
version = "0.1.0"
description = "A decision engine for booking flights cheaply, from and to India."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The core engine stays stdlib-only and portable. Numerics are needed only
# to fit the market model from observed fares.
# Free, keyless fare source. Pinned loosely: it is a scraper and Google can
# change the encoding, so expect occasional maintenance.
free = ["fast-flights>=3.0"]
calibrate = ["requests>=2.31", "numpy>=1.24", "scipy>=1.10"]
dev = ["pytest>=7"]

[project.scripts]
traveler = "traveler.cli:main"
traveler-snapshot = "traveler.calibration.snapshot:main"
traveler-backtest = "traveler.calibration.backtest:main"
traveler-fit = "traveler.calibration.fit:main"
traveler-import = "traveler.calibration.importers:main"

[tool.setuptools]
packages = ["traveler", "traveler.calibration"]

[tool.setuptools.package-data]
traveler = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real fare API; needs credentials. Deselected by default.",
]
addopts = "-m 'not live'"
